[package]
name = "aiv-studio"
version = "0.7.0"
description = "Local-first AI video editor"
authors = ["AIV Studio Contributors"]
edition = "2021"

[lib]
name = "aiv_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
# VFX Phase 6: glyph outlines for "Convert text to outlines" (MIT OR Apache-2.0). Reads the installed
# font files; nothing is bundled.
ttf-parser = "0.25"

# `aiv_check_windows` lets ai/resource_guard.rs's Windows FFI be type-checked on Linux:
# RUSTFLAGS="--cfg aiv_check_windows" cargo check
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(aiv_check_windows)'] }
